{{- define "manolo.image" -}}
{{- if not (regexMatch "^[^[:space:]@]+@sha256:[a-f0-9]{64}$" .) -}}
{{- fail "Manolo requires an immutable image reference ending in @sha256:<digest>" -}}
{{- end -}}
{{- . -}}
{{- end -}}
{{- $entries := dict -}}
{{- range $id, $agent := .Values.agents -}}
{{- if not (regexMatch "^[a-z][a-z0-9-]{0,31}$" $id) -}}{{ fail "Agent IDs must be Kubernetes name segments" }}{{- end -}}
{{- $_ := set $entries $id (dict "url" (printf "http://manolo-%s:8081" $id) "tokenEnv" $agent.tokenEnv) -}}
{{- end -}}
{{- $workSessionAgent := .Values.workSessionAgent -}}
{{- if not (kindIs "string" $workSessionAgent) -}}{{ fail "workSessionAgent must be a string" }}{{- end -}}
{{- if and $workSessionAgent .Values.relayDemoCredentials -}}
{{- fail "workSessionAgent cannot be enabled with relayDemoCredentials" -}}
{{- end -}}
{{- if $workSessionAgent -}}
{{- range $name := splitList "," $workSessionAgent -}}
{{- $trimmed := trim $name -}}
{{- if not $trimmed -}}{{ fail "workSessionAgent must be a comma-separated list of agent IDs" }}{{- end -}}
{{- if not (hasKey $entries $trimmed) -}}{{ fail (printf "workSessionAgent %q is not configured in agents" $trimmed) }}{{- end -}}
{{- end -}}
{{- end -}}
{{- $runtimeAgent := .Values.runtimeAgent -}}
{{- if not (kindIs "string" $runtimeAgent) -}}{{ fail "runtimeAgent must be a string" }}{{- end -}}
{{- if not (kindIs "slice" .Values.relayConfig.rooms) -}}{{ fail "relayConfig.rooms must be a list" }}{{- end -}}
{{- $roomIds := dict -}}
{{- range .Values.relayConfig.rooms -}}
{{- if not (and (kindIs "map" .) (kindIs "string" .agent) (hasKey $entries .agent)) -}}
{{- fail "Each relayConfig.rooms entry must reference a configured agent" -}}
{{- end -}}
{{- if eq .agent $runtimeAgent -}}{{ fail "runtimeAgent must be web-only: relayConfig.rooms must not target it" }}{{- end -}}
{{- if not (and (kindIs "string" .chatId) (regexMatch "^-[1-9][0-9]{0,15}$" .chatId)) -}}
{{- fail "relayConfig.rooms requires a negative chatId string" -}}
{{- end -}}
{{- if hasKey $roomIds .chatId -}}{{ fail "Configure only one agent per Telegram room" }}{{- end -}}
{{- $_ := set $roomIds .chatId true -}}
{{- if not (and (kindIs "string" .wake) (has .wake (list "all" "mentions"))) -}}
{{- fail "relayConfig.rooms wake must be all or mentions" -}}
{{- end -}}
{{- if not (and (kindIs "slice" .members) .members) -}}{{ fail "relayConfig.rooms requires a nonempty members list" }}{{- end -}}
{{- end -}}
{{- if $runtimeAgent -}}
{{- if not (hasKey $entries $runtimeAgent) -}}{{ fail (printf "runtimeAgent %q is not configured in agents" $runtimeAgent) }}{{- end -}}
{{- if hasKey $entries "runtimes" -}}{{ fail "runtimes is a reserved agent ID when the runtime companion listener is enabled" }}{{- end -}}
{{- if .Values.relayDemoCredentials -}}{{ fail "runtimeAgent cannot be enabled with relayDemoCredentials" }}{{- end -}}
{{- with .Values.relayConfig.routes -}}
{{- if not (kindIs "slice" .) -}}{{ fail "relayConfig.routes must be a list" }}{{- end -}}
{{- range . -}}
{{- if not (kindIs "map" .) -}}{{ fail "relayConfig.routes entries must be mappings" }}{{- end -}}
{{- if and (kindIs "string" .agent) (eq .agent $runtimeAgent) -}}
{{- fail (printf "runtimeAgent %q must be web-only: relayConfig.routes must not target it" $runtimeAgent) -}}
{{- end -}}
{{- end -}}
{{- end -}}
{{- if not (and (kindIs "slice" .Values.runtimeIngressFrom) .Values.runtimeIngressFrom) -}}
{{- fail "runtimeAgent requires a nonempty runtimeIngressFrom list" -}}
{{- end -}}
{{- range $i, $peer := .Values.runtimeIngressFrom -}}
{{- $path := printf "runtimeIngressFrom[%d]" $i -}}
{{- if not (kindIs "map" $peer) -}}{{ fail (printf "%s must be a NetworkPolicy peer mapping" $path) }}{{- end -}}
{{- $restricted := false -}}
{{- range $key, $value := $peer -}}
{{- if not (kindIs "map" $value) -}}{{ fail (printf "%s.%s must be a mapping" $path $key) }}{{- end -}}
{{- if eq $key "ipBlock" -}}
{{- if or (ne (len $peer) 1) (not (kindIs "string" $value.cidr)) (not ($value.cidr | trim)) (regexMatch "/0+$" ($value.cidr | trim)) -}}
{{- fail (printf "%s.ipBlock requires a restricted CIDR and cannot be combined with selectors" $path) -}}
{{- end -}}
{{- $restricted = true -}}
{{- else if or (eq $key "podSelector") (eq $key "namespaceSelector") -}}
{{- if or $value.matchLabels $value.matchExpressions -}}{{- $restricted = true -}}{{- end -}}
{{- else -}}
{{- fail (printf "%s.%s is not a NetworkPolicy peer field" $path $key) -}}
{{- end -}}
{{- end -}}
{{- if not $restricted -}}{{ fail (printf "%s must not be empty or allow unrestricted ingress" $path) }}{{- end -}}
{{- end -}}
{{- end -}}
apiVersion: v1
kind: ConfigMap
metadata:
  name: manolo-relay
  namespace: {{ .Release.Namespace }}
data:
  relay.json: {{ (merge (dict "agents" $entries) .Values.relayConfig) | mustToJson | quote }}
{{- $workloads := list (dict "name" "manolo-relay" "kind" "relay" "image" .Values.relayImage "secret" .Values.relaySecret "storage" .Values.relayStorage "port" 8080) -}}
{{- range $id, $agent := .Values.agents -}}
{{- if eq $id "relay" }}{{ fail "relay is a reserved agent ID" }}{{ end -}}
{{- $workloads = append $workloads (merge (dict "name" (printf "manolo-%s" $id) "kind" "worker" "agentId" $id "port" 8081) $agent) -}}
{{- end -}}
{{- range $w := $workloads }}
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: {{ $w.name }}-data
  namespace: {{ $.Release.Namespace }}
spec:
  accessModes: [ReadWriteOnce]
  storageClassName: {{ $.Values.storageClassName | quote }}
  resources:
    requests:
      storage: {{ $w.storage | quote }}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ $w.name }}
  namespace: {{ $.Release.Namespace }}
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels: {app.kubernetes.io/name: {{ $w.name }}}
  template:
    metadata:
      labels: {app.kubernetes.io/name: {{ $w.name }}, manolo.lan/component: {{ $w.kind }} }
      {{- if eq $w.kind "relay" }}
      annotations:
        manolo.lan/config-checksum: {{ (merge (dict "agents" $entries) $.Values.relayConfig) | mustToJson | sha256sum }}
      {{- end }}
    spec:
      automountServiceAccountToken: false
      terminationGracePeriodSeconds: 25
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
        fsGroupChangePolicy: OnRootMismatch
        seccompProfile: {type: RuntimeDefault}
      {{- with $.Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      containers:
        - name: {{ $w.kind }}
          image: {{ include "manolo.image" $w.image | quote }}
          args: ["node", "src/{{ $w.kind }}.mjs"]
          securityContext:
            allowPrivilegeEscalation: false
            capabilities: {drop: [ALL]}
            readOnlyRootFilesystem: true
          ports:
            - {name: http, containerPort: {{ $w.port }}}
            {{- if eq $w.kind "relay" }}
            - {name: internal, containerPort: 8082}
            {{- if $runtimeAgent }}
            - {name: runtimes, containerPort: 8084}
            {{- end }}
            {{- end }}
          readinessProbe:
            httpGet: {path: /healthz, port: http}
          livenessProbe:
            httpGet: {path: /healthz, port: http}
          startupProbe:
            httpGet: {path: /healthz, port: http}
            failureThreshold: 30
            periodSeconds: 2
          envFrom:
            - secretRef: {name: {{ $w.secret }}}
          env:
            - {name: HOME, value: /data}
            - {name: PORT, value: {{ $w.port | quote }}}
            {{- if eq $w.kind "relay" }}
            - {name: MANOLO_RELAY_CONFIG, value: /config/relay.json}
            {{- if $workSessionAgent }}
            - {name: MANOLO_WORK_SESSION_AGENT, value: {{ $workSessionAgent | quote }}}
            {{- end }}
            - {name: MANOLO_INTERNAL_HOST, value: "0.0.0.0"}
            {{- with $.Values.webProxyAuthHeader }}
            - {name: MANOLO_PROXY_AUTH_HEADER, value: {{ . | quote }}}
            {{- end }}
            {{- if $runtimeAgent }}
            - {name: MANOLO_RUNTIME_AGENT, value: {{ $runtimeAgent | quote }}}
            - {name: MANOLO_RUNTIME_HOST, value: "0.0.0.0"}
            {{- end }}
            {{- if $.Values.relayDemoCredentials }}
            - {name: MANOLO_DEMO, value: "1"}
            - {name: MANOLO_DEMO_ALLOW_NETWORK, value: "1"}
            {{- end }}
            {{- else }}
            - {name: MANOLO_AGENT_ID, value: {{ $w.agentId | quote }}}
            - {name: MANOLO_RELAY_URL, value: "http://manolo-relay:8082"}
            {{- if hasKey $w "codingTools" }}
            {{- if not (kindIs "bool" $w.codingTools) }}{{ fail "agents.<id>.codingTools must be a boolean" }}{{ end }}
            {{- if not $w.codingTools }}
            - {name: MANOLO_CODING_TOOLS, value: "0"}
            {{- end }}
            {{- end }}
            {{- with $w.instructions }}
            - {name: MANOLO_AGENT_INSTRUCTIONS, value: {{ . | quote }}}
            {{- end }}
            {{- if hasKey $w "workBlueprints" }}
            {{- if not (kindIs "map" $w.workBlueprints) }}{{ fail "agents.<id>.workBlueprints must be a mapping" }}{{ end }}
            {{- if $w.workBlueprints }}
            - {name: MANOLO_WORK_BLUEPRINTS, value: {{ $w.workBlueprints | mustToJson | quote }}}
            {{- end }}
            {{- end }}
            {{- if hasKey $w "mcpServers" }}
            {{- if not (kindIs "map" $w.mcpServers) }}{{ fail "agents.<id>.mcpServers must be a mapping" }}{{ end }}
            {{- if $w.mcpServers }}
            - {name: MANOLO_MCP_SERVERS, value: {{ $w.mcpServers | mustToJson | quote }}}
            {{- end }}
            {{- end }}
            {{- with $w.bashEnv }}
            - {name: MANOLO_BASH_ENV, value: {{ join "," . | quote }}}
            {{- end }}
            {{- if $w.fixture }}
            - {name: MANOLO_MODE, value: fixture}
            {{- else }}
            - {name: MANOLO_PROVIDER, value: {{ required (printf "%s provider required outside fixture mode" $w.agentId) $w.provider | quote }}}
            - {name: MANOLO_MODEL, value: {{ required (printf "%s model required outside fixture mode" $w.agentId) $w.model | quote }}}
            {{- with $w.thinkingLevel }}
            - {name: MANOLO_THINKING_LEVEL, value: {{ . | quote }}}
            {{- end }}
            {{- end }}
            {{- end }}
          resources:
            requests: {cpu: 50m, memory: 128Mi}
            {{- if eq $w.kind "worker" }}
            limits: {memory: 1Gi}
            {{- else }}
            limits: {memory: 512Mi}
            {{- end }}
          volumeMounts:
            - {name: data, mountPath: /data}
            - {name: tmp, mountPath: /tmp}
            # The image root filesystem is read-only. Give the runtime user a
            # writable home so operator tools run via `kubectl exec` can keep
            # state (git config, mise runtimes); it holds no application data.
            - {name: home, mountPath: /home/node}
            {{- if eq $w.kind "relay" }}
            - {name: config, mountPath: /config, readOnly: true}
            {{- end }}
      volumes:
        - name: data
          persistentVolumeClaim: {claimName: {{ $w.name }}-data}
        - name: tmp
          emptyDir: {sizeLimit: {{ if eq $w.kind "worker" }}256Mi{{ else }}32Mi{{ end }}}
        - name: home
          emptyDir: {sizeLimit: 1Gi}
        {{- if eq $w.kind "relay" }}
        - name: config
          configMap: {name: manolo-relay}
        {{- end }}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ $w.name }}
  namespace: {{ $.Release.Namespace }}
spec:
  selector: {app.kubernetes.io/name: {{ $w.name }}}
  ports:
    - {name: http, port: {{ $w.port }}, targetPort: http}
    {{- if eq $w.kind "relay" }}
    - {name: internal, port: 8082, targetPort: internal}
    {{- end }}
{{- end }}
{{- if $runtimeAgent }}
---
apiVersion: v1
kind: Service
metadata:
  name: manolo-runtimes
  namespace: {{ .Release.Namespace }}
spec:
  type: ClusterIP
  selector: {app.kubernetes.io/name: manolo-relay}
  ports:
    - {name: runtimes, port: 8084, targetPort: runtimes}
{{- end }}
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: manolo-workers
  namespace: {{ .Release.Namespace }}
spec:
  podSelector: {matchLabels: {manolo.lan/component: worker}}
  policyTypes: [Ingress]
  ingress:
    - from:
        - podSelector: {matchLabels: {manolo.lan/component: relay}}
      ports: [{port: 8081, protocol: TCP}]
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: manolo-relay
  namespace: {{ .Release.Namespace }}
spec:
  podSelector: {matchLabels: {manolo.lan/component: relay}}
  policyTypes: [Ingress]
  ingress:
    - from:
        - podSelector: {matchLabels: {manolo.lan/component: worker}}
      ports: [{port: 8082, protocol: TCP}]
    {{- with .Values.webIngressFrom }}
    - from:
        {{- toYaml . | nindent 8 }}
      ports: [{port: 8080, protocol: TCP}]
    {{- end }}
    {{- if $runtimeAgent }}
    - from:
        {{- toYaml .Values.runtimeIngressFrom | nindent 8 }}
      ports: [{port: 8084, protocol: TCP}]
    {{- end }}
