# Image fields must be immutable digests. The canary can be promoted independently.
relayImage: ""
relaySecret: manolo-relay
relayStorage: 1Gi
storageClassName: longhorn
# The PoC uses Basic Auth; expose through HTTPS or kubectl port-forward only.
relayDemoCredentials: false # Sets MANOLO_DEMO on the relay so short owner passwords load. Isolated smoke tests only.
# A future HTTPRoute requires explicitly permitting the Gateway's source namespace/pods.
webIngressFrom: []
# Optional cluster-internal runtime companion listener. The agent must be web-only
# (not targeted by relayConfig.routes), and relayDemoCredentials must be disabled.
runtimeAgent: ''
# Enable work-session delegation for this agent's authenticated web turns only.
# Update the relay and this agent's worker image before opting in.
workSessionAgent: ''
# Required when runtimeAgent is set. Supply restricted Kubernetes NetworkPolicy peers.
runtimeIngressFrom: []
relayConfig:
  owners:
    owner: {agent: primary, passwordEnv: MANOLO_OWNER_PASSWORD}
    tester: {agent: canary, passwordEnv: MANOLO_TESTER_PASSWORD}
  routes: []
  inbox:
    - {from: primary, to: canary}

agents:
  primary:
    image: ""
    secret: manolo-primary
    tokenEnv: MANOLO_PRIMARY_TOKEN
    storage: 2Gi
    provider: ""
    model: ""
    instructions: "" # Non-secret behavior instructions; changing this restarts only this worker.
    codingTools: true # Set false to keep the pod shell and file tools unavailable to this agent.
    # Extra environment names the worker's bash tool receives. Only an allowlist reaches the shell; the agent token
    # and provider key are refused even when named here.
    bashEnv: []
    workBlueprints: {} # Optional named, non-secret instructions for delegated work.
    fixture: false
  canary:
    image: ""
    secret: manolo-canary
    tokenEnv: MANOLO_CANARY_TOKEN
    storage: 2Gi
    provider: ""
    model: ""
    instructions: ""
    codingTools: true
    bashEnv: []
    workBlueprints: {}
    fixture: false
