# Image fields must be immutable digests. The canary can be promoted independently.
relayImage: ""
relaySecret: manolo-relay
relayStorage: 1Gi
storageClassName: longhorn
# Browsers sign in at /login and get an in-memory session cookie; Basic Auth stays for scripts.
# Expose through HTTPS or kubectl port-forward only. Cookie sessions reset when the relay restarts.
relayDemoCredentials: false # Sets MANOLO_DEMO on the relay so short owner passwords load. Isolated smoke tests only.
# A future HTTPRoute requires explicitly permitting the Gateway's source namespace/pods.
webIngressFrom: []
# Optional SSO bypass. When set (for example x-auth-request-user), the relay trusts that
# header from an authenticating gateway as an already-verified owner name. Enable it only
# when the relay is reachable exclusively through that gateway.
# Optional cluster-internal runtime companion listener. The agent must be web-only
# (not targeted by relayConfig.routes or relayConfig.rooms), and relayDemoCredentials must be disabled.
runtimeAgent: ''
# Enable work-session delegation for these agents' authenticated web turns only, as a
# comma-separated list of agent IDs (for example "primary,canary"). Update the relay and
# each listed worker's image before opting in.
workSessionAgent: ''
# Required when runtimeAgent is set. Supply restricted Kubernetes NetworkPolicy peers.
runtimeIngressFrom: []
webProxyAuthHeader: ''
relayConfig:
  owners:
    owner: {agent: primary, passwordEnv: MANOLO_OWNER_PASSWORD}
    tester: {agent: canary, passwordEnv: MANOLO_TESTER_PASSWORD}
  routes: []
  rooms: [] # Opt-in direct Telegram text rooms; see README for the binding shape.
  inbox:
    - {from: primary, to: canary}

agents:
  primary:
    image: ""
    secret: manolo-primary
    tokenEnv: MANOLO_PRIMARY_TOKEN
    storage: 2Gi
    provider: ""
    model: ""
    instructions: "" # Non-secret behavior instructions; changing this restarts only this worker.
    codingTools: true # Set false to keep the pod shell and file tools unavailable to this agent.
    # Extra environment names the worker's bash tool receives. Only an allowlist reaches the shell; the agent token
    # and provider key are refused even when named here.
    bashEnv: []
    workBlueprints: {} # Optional named, non-secret instructions for delegated work.
    mcpServers: {} # Operator-trusted Streamable HTTP endpoints and explicit tool allowlists.
    fixture: false
  canary:
    image: ""
    secret: manolo-canary
    tokenEnv: MANOLO_CANARY_TOKEN
    storage: 2Gi
    provider: ""
    model: ""
    instructions: ""
    codingTools: true
    bashEnv: []
    workBlueprints: {}
    mcpServers: {}
    fixture: false
